name: 경기 일정 갱신

on:
  schedule:
    # cron 은 UTC 기준. 아래 두 줄이 한국시간 06:00 / 23:30 이다.
    - cron: "0 21 * * *"      # 21:00 UTC = 다음날 06:00 KST — 일정 변경 반영 + 데이터 커밋
    - cron: "30 14 * * *"     # 14:30 UTC = 당일 23:30 KST — 밤경기 결과 반영
  workflow_dispatch:          # Actions 탭에서 손으로도 돌릴 수 있다
  push:
    branches: [main]
    paths-ignore: [matches.json]   # 아래 커밋 단계가 자기 자신을 다시 부르지 않도록

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write     # matches.json 커밋용
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 저장소에 들어 있는 matches.json 이 '직전 상태' 역할을 한다.
      # 원본 사이트가 잠깐 죽어도 그 대회만 직전 값으로 버티고 나머지는 갱신된다.
      - name: 경기 일정 수집
        run: python scraper.py

      - name: 무결성 점검      # 여기서 걸리면 배포하지 않는다 (기존 페이지가 그대로 남는다)
        run: python check.py

      - name: 페이지 빌드
        run: python build.py

      # 하루 한 번만 커밋한다.
      # 직전 상태를 보관하는 목적이자, GitHub 이 "60일간 저장소 활동이 없으면
      # 예약 워크플로를 자동으로 꺼버리는" 규칙에 걸리지 않게 하는 장치다.
      - name: 데이터 커밋
        if: github.event_name != 'schedule' || github.event.schedule == '0 21 * * *'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy

      - name: 결과 요약
        if: always()
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          p = pathlib.Path("matches.json")
          print("### 갱신 결과\n")
          if not p.exists():
              print("matches.json 이 만들어지지 않았습니다."); raise SystemExit
          d = json.loads(p.read_text(encoding="utf-8"))
          print(f"- 기준 시각 **{d['generatedAt']}**")
          print(f"- 총 **{len(d['matches'])}경기**\n")
          print("| 대회 | 경기 수 | 상태 |")
          print("|---|---:|---|")
          for l in d["leagues"]:
              print(f"| {l['name']} | {l['count']} | {l['status']} |")
          PY
