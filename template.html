<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--HEAD_START-->
<title>경기 있는 날</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* 리그별 색(--lg-*)은 데이터에 들어 있는 등록부를 읽어 런타임에 주입한다.
   리그를 추가해도 이 스타일시트는 손댈 필요가 없다. */
:root{
  --bg:#EFF2EE; --surface:#FFFFFF; --surface-2:#F6F9F5; --raise:0 1px 2px rgba(22,29,25,.06);
  --ink:#161D19; --ink-2:#46534B; --muted:#78857C;
  --line:#DCE3DA; --line-strong:#C2CDC0;
  --live:#B93028; --sat:#26346F; --win:#0F6F5F; --focus:#26346F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --surface:#161E1A; --surface-2:#1C2620; --raise:0 1px 2px rgba(0,0,0,.4);
    --ink:#E9EFEA; --ink-2:#AEBAB2; --muted:#7F8D85;
    --line:#27312B; --line-strong:#3B4740;
    --live:#E4675C; --sat:#8B9CE8; --win:#43C4A9; --focus:#8B9CE8;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161E1A; --surface-2:#1C2620; --raise:0 1px 2px rgba(0,0,0,.4);
  --ink:#E9EFEA; --ink-2:#AEBAB2; --muted:#7F8D85;
  --line:#27312B; --line-strong:#3B4740;
  --live:#E4675C; --sat:#8B9CE8; --win:#43C4A9; --focus:#8B9CE8;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* ─────────── 상단 마스트헤드 ─────────── */
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.masthead{border-bottom:1px solid var(--line);background:var(--surface)}
.masthead .wrap{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;padding-top:14px;padding-bottom:12px}
.wordmark{font-family:"Black Han Sans","Gothic A1",sans-serif;font-size:26px;letter-spacing:.01em;line-height:1;margin:0}
.wordmark .dash{color:var(--muted)}
.sub{margin:0;font-size:13px;color:var(--muted);letter-spacing:-.01em}
.tagline{color:var(--muted);font-size:12.5px;letter-spacing:.02em;margin-left:auto}
.tagline b{color:var(--ink-2);font-weight:700}

/* ─────────── 날짜 내비 ─────────── */
.datebar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.datebar .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.navbtn{width:34px;height:34px;border:1px solid var(--line-strong);border-radius:8px;
  display:grid;place-items:center;color:var(--ink-2);background:var(--surface);flex:none}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn svg{width:16px;height:16px}
.bigdate{display:flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden}
.dtools{display:flex;gap:8px;flex:none}
.bigdate .d{font-family:"Black Han Sans",sans-serif;font-size:22px;line-height:1.1;white-space:nowrap}
.bigdate .w{font-size:13px;color:var(--muted);white-space:nowrap}
.bigdate .w.sat{color:var(--sat)} .bigdate .w.sun{color:var(--live)}
.spacer{flex:1}
.ghost{border:1px solid var(--line-strong);border-radius:8px;padding:6px 11px;font-size:13px;
  color:var(--ink-2);background:var(--surface);white-space:nowrap}
.ghost:hover{background:var(--surface-2);color:var(--ink)}
input[type=date].ghost{padding:5px 8px}

/* ─────────── 주간 스트립 ─────────── */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-bottom:10px}
.day{border:1px solid transparent;border-radius:10px;padding:6px 2px 5px;text-align:center;background:var(--surface-2)}
.day:hover{border-color:var(--line-strong)}
.day .wd{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.day .dd{font-size:16px;font-weight:700;line-height:1.3}
.day .dots{display:flex;justify-content:center;gap:3px;height:5px;margin-top:3px}
.day .dots i{width:5px;height:5px;border-radius:50%;display:block}
.day.sel{background:var(--ink);border-color:var(--ink)}
.day.sel .wd,.day.sel .dd{color:var(--bg)}
.day.today .dd{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.day.sat .wd{color:var(--sat)} .day.sun .wd{color:var(--live)}
.day.sel.sat .wd,.day.sel.sun .wd{color:var(--bg)}

/* ─────────── 종목 · 필터 ─────────── */
.sports{display:flex;gap:6px;flex-wrap:wrap;padding-top:14px;align-items:center}
.sport{border:1px solid var(--line-strong);border-radius:8px;padding:5px 13px;font-size:13.5px;
  font-weight:700;color:var(--muted);background:var(--surface)}
.sport.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* 리그 모노그램 배지 — 공식 엠블럼 대신 리그 색 방패(크레스트)에 약칭을 넣는다 */
.bdg{width:24px;height:27px;flex:none;display:inline-grid;place-items:center;
  border-radius:7px 7px 50% 50% / 7px 7px 62% 62%;           /* 방패 실루엣 */
  background:var(--tier);color:var(--badge-ink);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4), inset 0 -7px 10px -6px rgba(0,0,0,.28);
  font-family:"Black Han Sans","Gothic A1",sans-serif;
  font-size:10px;font-weight:400;letter-spacing:-.02em;font-style:normal;line-height:1;
  padding-bottom:2px}                                          /* 뾰족한 아랫부분만큼 글자를 살짝 올린다 */
.bdg.s{width:48px;height:54px;font-size:19px;border-radius:11px 11px 50% 50% / 11px 11px 62% 62%;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4), inset 0 -11px 15px -9px rgba(0,0,0,.28)}  /* 섹션 제목용 대형 */
:root{--badge-ink:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--badge-ink:#0E1411}}
:root[data-theme="dark"]{--badge-ink:#0E1411}
.chip{border:1px solid var(--line-strong);border-radius:999px;padding:4px 12px 4px 5px;font-size:13px;font-weight:700;
  color:var(--muted);background:var(--surface);display:flex;align-items:center;gap:6px}
.chip .bdg{opacity:.35;filter:grayscale(.55)}      /* 꺼진 리그는 배지도 흐려진다 */
.chip.on{color:var(--tier);border-color:var(--tier);background:var(--tier-soft)}
.chip.on .bdg{opacity:1;filter:none}
.chipsep{width:1px;align-self:stretch;background:var(--line-strong);margin:2px 4px}
.chip.cup{border-style:dashed}   /* 컵대회는 리그와 성격이 달라 테두리로 구분한다 */
.tabs{display:flex;gap:2px;margin-left:auto;border:1px solid var(--line-strong);border-radius:9px;padding:2px;background:var(--surface)}
.tab{padding:5px 12px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:700}
.tab.on{background:var(--ink);color:var(--bg)}

/* ─────────── 알림 탭 ─────────── */
.alertbox{max-width:780px}
.alertbox h2.at{margin:18px 0 4px;font-size:21px}
.alertbox .lead{color:var(--muted);margin:0 0 16px;font-size:13.5px;line-height:1.6}
/* 조건 카드 */
.arules{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.arule{display:flex;align-items:center;gap:6px;max-width:100%;border:1.5px solid var(--line-strong);
  border-radius:12px;padding:8px 8px 8px 12px;background:var(--surface);font-size:13px;color:var(--ink-2);cursor:pointer}
.arule b{color:var(--ink);font-weight:800;white-space:nowrap}
.arule span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.arule.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.arule .x{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 4px;cursor:pointer}
.arule .x:hover{color:var(--live)}
.aadd{border:1.5px dashed var(--line-strong);border-radius:12px;padding:8px 14px;font-size:13px;
  font-weight:700;color:var(--ink-2);background:none;cursor:pointer}
/* 카테고리 */
.acat{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;overflow:hidden}
.acat-h{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border:0;background:none;
  font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.acat-h .k{font-weight:800;font-size:14.5px;min-width:38px}
.acat-h .v{flex:1;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acat-h .v.set{color:var(--ink-2);font-weight:700}
.acat-h .chev{color:var(--muted);transition:transform .15s}
.acat.open .acat-h .chev{transform:rotate(180deg)}
.acat-b{padding:2px 14px 14px;border-top:1px solid var(--line)}
.agrp{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:12px 0 6px}
.aopts{display:flex;flex-wrap:wrap;gap:6px}
.aopt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;
  padding:6px 12px 6px 9px;font-size:13.5px;color:var(--ink-2);background:var(--surface);cursor:pointer;user-select:none}
.aopt input{margin:0;accent-color:var(--ink);width:15px;height:15px}
.aopt.dim{opacity:.45}
.aopt.on{opacity:1;border-color:var(--ink);color:var(--ink);font-weight:700;background:var(--surface-2)}
.aquick{display:flex;gap:6px;margin-top:10px}
.aquick button{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;
  color:var(--ink-2);background:var(--surface-2);cursor:pointer}
.aclear{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;margin-top:10px;padding:0}
/* 저장 */
.asave{border-radius:12px;padding:14px 16px;margin:14px 0 18px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;line-height:1.6}
.asave .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.abtn{border:1px solid var(--line-strong);border-radius:9px;padding:9px 16px;font-size:13.5px;
  font-weight:800;color:var(--ink-2);background:var(--surface);text-decoration:none;cursor:pointer}
.abtn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.abtn:hover{border-color:var(--ink)}
@media (max-width:640px){ .arule span{max-width:190px} }

/* ─────────── 경기 리스트 ─────────── */
main{padding:8px 0 64px}
.tiergroup{margin-top:18px}
.tierhead{display:flex;align-items:center;gap:11px;padding-bottom:8px;border-bottom:2px solid var(--tier);margin-bottom:2px}
.tierhead h2{margin:0;font-size:26px;font-weight:800;letter-spacing:.03em;color:var(--tier)}
.tierhead .sp{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.tierhead .n{font-size:14px;color:var(--muted)}

.match{display:grid;grid-template-columns:60px 1fr auto;gap:0 14px;align-items:center;
  padding:13px 14px 13px 12px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--tier);border-radius:2px 10px 10px 2px;margin-top:8px;box-shadow:var(--raise)}
.match .kick{text-align:center}
.match .kick .t{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.match .kick .r{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.teams{min-width:0}
.teams .row{display:flex;align-items:center;gap:7px;line-height:1.45}
.teams .nm{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teams .row.dim .nm{color:var(--ink-2);font-weight:500}
.homeflag{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--tier);
  border:1px solid var(--tier);border-radius:3px;padding:0 3px;line-height:14px;flex:none}
.venue{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.venue svg{width:12px;height:12px;flex:none;opacity:.7}
.venue a{text-decoration:none;border-bottom:1px dotted var(--line-strong)}
.venue a:hover{color:var(--ink);border-bottom-color:currentColor}
.venue .bc{padding-left:7px;margin-left:2px;border-left:1px solid var(--line);opacity:.85}

.score{text-align:right;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.score .g{font-size:20px;font-weight:700;line-height:1.35;display:block}
.score .g.lose{color:var(--muted);font-weight:400}
.score .pend{font-size:11px;color:var(--muted);letter-spacing:.06em;font-family:"Gothic A1",sans-serif}
.score .note{display:inline-block;max-width:104px;line-height:1.35;color:var(--tier);font-weight:700}
/* 예매 버튼. 링크가 어디로 가는지에 따라 생김새를 다르게 한다.
   진한 것 = 그 경기 예매 페이지 / 흐린 것 = 구단 홈페이지 */
.tkt{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;
  font-family:"Gothic A1",sans-serif;font-size:11px;font-weight:800;letter-spacing:.02em;
  text-decoration:none;white-space:nowrap;
  color:var(--tier);border:1px solid var(--tier);background:var(--tier-soft)}
.tkt:hover{color:var(--surface);background:var(--tier)}
.tkt.club{color:var(--muted);border-color:var(--line-strong);background:var(--surface);font-weight:700}
.tkt.club:hover{color:var(--ink);border-color:var(--ink-2);background:var(--surface-2)}
.tline .tkt{margin-top:4px}

/* ─────────── 달력 뷰 ─────────── */
.calhead{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.calhead h2{font-family:"Black Han Sans",sans-serif;font-size:20px;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wdh{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;padding-bottom:2px}
.cal .wdh.sat{color:var(--sat)} .cal .wdh.sun{color:var(--live)}
.cell{min-height:74px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  padding:5px 6px;text-align:left;display:flex;flex-direction:column;gap:3px}
.cell.blank{background:transparent;border-color:transparent}
.cell:not(.blank):hover{border-color:var(--line-strong);background:var(--surface-2)}
.cell .n{font-size:12px;font-weight:700;color:var(--ink-2)}
.cell.today .n{background:var(--ink);color:var(--bg);border-radius:4px;padding:0 4px;align-self:flex-start}
.cell .bars{display:flex;flex-direction:column;gap:2px}
.cell .bar{font-size:10px;font-weight:700;letter-spacing:.02em;border-radius:3px;padding:1px 4px;
  display:flex;justify-content:space-between;gap:4px}

/* ─────────── 팀별 뷰 ─────────── */
.teampick{display:flex;align-items:center;gap:8px;margin:18px 0 4px;flex-wrap:wrap}
select.ghost{padding:6px 9px;max-width:100%}
.tline{display:grid;grid-template-columns:78px 1fr auto;gap:0 12px;align-items:center;
  padding:10px 12px;border-bottom:1px solid var(--line)}
.tline:hover{background:var(--surface-2)}
.tline .dt{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tline .op{font-size:14.5px}
.tline .op .ha{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin-right:5px}
.tline .op .lg{font-size:10px;font-weight:800;color:var(--tier);letter-spacing:.04em;margin-left:6px}
.tline .vn{font-size:12px;color:var(--muted);margin-top:2px}
.tline .rs{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:700;text-align:right;white-space:nowrap}
.tline .rs.w{color:var(--win)} .tline .rs.l{color:var(--live)} .tline .rs.d{color:var(--muted)}
.tline .rs.up{font-family:"Gothic A1",sans-serif;font-size:11px;font-weight:400;color:var(--muted)}

.empty{text-align:center;padding:52px 20px;color:var(--muted);
  border:1px dashed var(--line-strong);border-radius:12px;margin-top:20px}
.empty .big{font-family:"Black Han Sans",sans-serif;font-size:19px;color:var(--ink-2);margin-bottom:5px}
.empty button{color:var(--focus);font-weight:700;text-decoration:underline;text-underline-offset:3px}

footer{border-top:1px solid var(--line);margin-top:40px;padding:18px 0 40px;font-size:12px;color:var(--muted)}
footer .wrap{display:flex;flex-direction:column;gap:6px}
footer .row{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
footer b{color:var(--ink-2)}
footer .pending{color:var(--muted)}
footer .pending b{color:var(--ink-2)}

@media (max-width:600px){
  .wordmark{font-size:22px}
  .tagline{width:100%;margin-left:0;order:3}
  .datebar .wrap{flex-wrap:wrap}
  .spacer{display:none}
  .bigdate{flex:1 1 auto}
  .dtools{order:5;flex-basis:100%;width:100%}
  .dtools #todayBtn{flex:none}
  .dtools #datePick{flex:1 1 auto;min-width:0}
  .tabs{order:-1;margin-left:0;width:100%}
  .tab{flex:1;text-align:center}
  .match{grid-template-columns:52px 1fr auto;gap:0 10px;padding:11px 11px 11px 10px}
  .venue{flex-wrap:wrap}
  .venue .bc{flex-basis:100%;border-left:0;padding-left:17px;margin-left:0;margin-top:1px}
  .teams .nm{font-size:14.5px}
  .cell{min-height:60px}
  .cell .bar{font-size:9px;padding:1px 3px}
  .tline{grid-template-columns:66px 1fr auto;gap:0 8px}
  .chipsep{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<!--HEAD_END-->
</head>
<body>
<!--BODY_START-->
<header class="masthead">
  <div class="wrap">
    <h1 class="wordmark">경기 있는 날</h1>
    <p class="sub">한국에서 볼 수 있는 경기를 날짜별로</p>
    <div class="tagline"><b id="seasonLabel"></b> · <span id="countLabel"></span></div>
  </div>
</header>

<div class="datebar">
  <div class="wrap">
    <button class="navbtn" id="prevDay" aria-label="이전 날짜">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="bigdate"><span class="d" id="bigDate"></span><span class="w" id="bigWd"></span></div>
    <span class="spacer"></span>
    <div class="dtools">
      <button class="ghost" id="todayBtn">오늘</button>
      <input type="date" class="ghost" id="datePick" aria-label="날짜 선택">
    </div>
    <button class="navbtn" id="nextDay" aria-label="다음 날짜">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
  <div class="wrap"><div class="strip" id="strip"></div></div>
</div>

<div class="wrap">
  <div class="sports" id="sports"></div>
  <div class="tools">
    <div class="chips" id="chips"></div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-view="day">날짜</button>
      <button class="tab" data-view="month">달력</button>
      <button class="tab" data-view="team">팀별</button>
      <button class="tab" data-view="alert">알림</button>
    </div>
  </div>
</div>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    <div class="row">
      <span>출처 <b>한국프로축구연맹</b>(K리그1·2, 코리아컵, ACL) · <b>대한축구협회</b>(K3·K4) · <b>KBO</b> · <b>KBL</b> · <b>WKBL</b> · <b>한국배구연맹</b>(V리그)</span>
      <span>데이터 기준 <b id="genAt"></b> KST</span>
      <span>경기 시간·장소는 변경될 수 있습니다.</span>
      <span><b>예매</b>는 그 경기 판매 페이지로, <b>구단 홈</b>은 구단 홈페이지로 갑니다.</span>
    </div>
    <div class="row pending" id="pending"></div>
  </div>
</footer>

<script>
const DATA = /*__MATCHES__*/{"season":2026,"generatedAt":"","sports":[],"leagues":[],"matches":[]}/*__END__*/;

const WD = ["일","월","화","수","목","금","토"];
const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/></svg>';

/* ── 리그 등록부: 색·순서·종목이 전부 데이터에서 온다 ── */
const REG = DATA.leagues || [];
const LG = Object.fromEntries(REG.map(l => [l.name, l]));
const LIVE = REG.filter(l => l.count > 0);                       // 실제로 경기가 있는 대회
const SPORTS = [...new Set(LIVE.map(l => l.sport))];
const MULTISPORT = SPORTS.length > 1;

/* 리그 색을 CSS 변수로 주입한다. 세 가지 테마 상태를 모두 덮는다. */
(function injectColors(){
  const vars = mode => REG.map(l => `--lg-${l.slug}:${l.color[mode]};--lg-${l.slug}-soft:${l.soft[mode]};`).join("");
  const el = document.createElement("style");
  el.textContent =
    `:root{${vars("light")}}\n` +
    `@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${vars("dark")}}}\n` +
    `:root[data-theme="dark"]{${vars("dark")}}`;
  document.head.appendChild(el);
})();

/* ── 날짜 유틸: 문자열(YYYY-MM-DD) 기준으로만 다룬다 ── */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const toDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const shift = (s,n) => { const d = toDate(s); d.setDate(d.getDate()+n); return iso(d); };
const TODAY = iso(new Date());

const byDate = {};
for (const m of DATA.matches) (byDate[m.date] ||= []).push(m);
const ALL_DATES = Object.keys(byDate).sort();

const openingDate = byDate[TODAY] ? TODAY
  : (ALL_DATES.find(d => d >= TODAY) || ALL_DATES[ALL_DATES.length-1] || TODAY);

const state = {
  date: openingDate,
  view: "day",
  sport: MULTISPORT ? null : (SPORTS[0] || null),   // null = 전 종목
  off: new Set(),                                   // 꺼둔 리그 이름
  team: null
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vars = name => `--tier:var(--lg-${LG[name].slug});--tier-soft:var(--lg-${LG[name].slug}-soft)`;
const mapLink = v => `https://map.naver.com/p/search/${encodeURIComponent(v)}`;
const shown = () => LIVE.filter(l => !state.sport || l.sport === state.sport);
const visible = m => (!state.sport || m.sport === state.sport) && !state.off.has(m.league);

/* ─────────── 헤더 ─────────── */
function renderHeader(){
  $("#seasonLabel").textContent = `${DATA.season} 시즌`;
  const sports = MULTISPORT ? `${SPORTS.length}개 종목 · ` : "";
  $("#countLabel").textContent =
    `${DATA.matches.length.toLocaleString("ko")}경기 · ${sports}${LIVE.length}개 대회`;
  $("#genAt").textContent = DATA.generatedAt ? DATA.generatedAt.slice(0,16).replace("T"," ") : "-";

  // 비어 있거나 최신이 아닌 대회는 숨기지 말고 이유를 밝힌다.
  const day = s => s ? `${Number(s.slice(5,7))}월 ${Number(s.slice(8,10))}일` : "이전";
  const notes = REG.map(l => {
    if (l.status === "stale")
      return `⚠ <b>${esc(l.name)}</b> — 원본에서 못 받아와 ${day(l.fetchedAt)} 자료를 보여주고 있습니다.`;
    if (l.status === "offseason")
      return `❄ <b>${esc(l.name)}</b> — 비시즌입니다. ${day(l.fetchedAt)}까지의 일정만 있습니다.`;
    if (l.count === 0)
      return `<b>${esc(l.name)}</b> — ${esc(l.note || "현재 등록된 경기가 없습니다.")}`;
    return null;
  }).filter(Boolean);
  $("#pending").innerHTML = notes.map(n => `<span>${n}</span>`).join("");
}

function renderSports(){
  const box = $("#sports");
  if (!MULTISPORT){ box.style.display = "none"; return; }
  box.style.display = "";
  const btn = (label, val) =>
    `<button class="sport${state.sport === val ? " on" : ""}" data-sport="${val === null ? "" : esc(val)}">${esc(label)}</button>`;
  box.innerHTML = btn("전체", null) + SPORTS.map(s => btn(s, s)).join("");
}

function renderChips(){
  const box = $("#chips");
  if (state.view === "team" || state.view === "alert"){ box.style.display = "none"; return; }
  box.style.display = "";
  let last = null, html = "";
  for (const l of shown()){
    if (last !== null && l.group !== last) html += `<span class="chipsep"></span>`;
    last = l.group;
    const on = !state.off.has(l.name);
    html += `<button class="chip${on?" on":""}${l.group==="컵대회"?" cup":""}" style="${vars(l.name)}" data-lg="${esc(l.name)}"
      aria-pressed="${on}" title="${esc(l.name)} ${l.count}경기"><i class="bdg">${esc(l.badge||"")}</i>${esc(l.name)}</button>`;
  }
  box.innerHTML = html;
}

function renderStrip(){
  const start = shift(state.date, -3);
  let html = "";
  for (let i = 0; i < 7; i++){
    const d = shift(start, i), dt = toDate(d), w = dt.getDay();
    const kinds = [...new Set((byDate[d] || []).filter(visible).map(m => LG[m.league].slug))];
    html += `<button class="day${d===state.date?" sel":""}${d===TODAY?" today":""}${w===6?" sat":""}${w===0?" sun":""}" data-d="${d}">
      <div class="wd">${WD[w]}</div><div class="dd">${dt.getDate()}</div>
      <div class="dots">${kinds.map(k=>`<i style="background:var(--lg-${k})"></i>`).join("")}</div></button>`;
  }
  $("#strip").innerHTML = html;

  const dt = toDate(state.date), w = dt.getDay();
  $("#bigDate").textContent = `${dt.getMonth()+1}월 ${dt.getDate()}일`;
  const wd = $("#bigWd");
  wd.textContent = `${WD[w]}요일${state.date===TODAY?" · 오늘":""}`;
  wd.className = "w" + (w===6?" sat":w===0?" sun":"");
  $("#datePick").value = state.date;
}

/* ─────────── 날짜 뷰 ─────────── */
function viewDay(){
  const list = (byDate[state.date] || []).filter(visible);
  if (!list.length){
    const next = ALL_DATES.find(d => d > state.date && (byDate[d]||[]).some(visible));
    return `<div class="empty"><div class="big">이 날은 경기가 없습니다</div>
      <div>${state.off.size || state.sport ? "지금 선택한 리그 기준입니다." : ""}</div>
      ${next ? `<p><button data-goto="${next}">다음 경기일 ${toDate(next).getMonth()+1}월 ${toDate(next).getDate()}일로 이동</button></p>` : ""}</div>`;
  }
  let html = "";
  for (const l of shown()){
    const ms = list.filter(m => m.league === l.name).sort((a,b) => a.time.localeCompare(b.time));
    if (!ms.length) continue;
    html += `<section class="tiergroup" style="${vars(l.name)}">
      <div class="tierhead">${MULTISPORT && !state.sport ? `<span class="sp">${esc(l.sport)}</span>` : ""}
        <i class="bdg s">${esc(l.badge||"")}</i><h2>${esc(l.name)}</h2><span class="n">${ms.length}경기</span></div>
      ${ms.map(matchCard).join("")}</section>`;
  }
  return html;
}

// 아직 안 한 경기에만 붙인다. 끝난 경기에 예매 버튼이 남아 있으면 헷갈린다.
function ticketLink(m){
  if (m.finished || !m.ticketUrl) return "";
  const shop = m.ticketKind === "shop";
  return `<a class="tkt${shop ? "" : " club"}" href="${esc(m.ticketUrl)}" target="_blank" rel="noopener"
    title="${shop ? "예매 페이지로 갑니다" : "구단 홈페이지로 갑니다. 거기서 예매 메뉴를 찾으세요"}"
    >${shop ? "예매" : "구단 홈"}</a>`;
}

function matchCard(m){
  const done = m.finished && m.homeGoal !== null;
  const hw = done && m.homeGoal > m.awayGoal, aw = done && m.awayGoal > m.homeGoal;
  return `<article class="match">
    <div class="kick"><div class="t">${esc(m.time || "--:--")}</div><div class="r">${m.round ? "R"+m.round : ""}</div></div>
    <div class="teams">
      <div class="row${done && aw ? " dim" : ""}"><span class="homeflag">홈</span><span class="nm">${esc(m.home)}</span></div>
      <div class="row${done && hw ? " dim" : ""}"><span class="nm">${esc(m.away)}</span></div>
      <div class="venue">${PIN}<a href="${mapLink(m.venue)}" target="_blank" rel="noopener">${esc(m.venue || "장소 미정")}</a>${
        m.broadcast ? `<span class="bc">${esc(m.broadcast)}</span>` : ""}</div>
    </div>
    <div class="score">${done
      ? `<span class="g${aw?" lose":""}">${m.homeGoal}</span><span class="g${hw?" lose":""}">${m.awayGoal}</span>${
          m.note ? `<br><span class="pend note">${esc(m.note)}</span>` : ""}`
      : m.note
        ? `<span class="pend note">${esc(m.note)}</span><br>${ticketLink(m)}`
        : `<span class="pend">경기 예정</span><br>${ticketLink(m)}`}</div>
  </article>`;
}

/* ─────────── 달력 뷰 ─────────── */
function viewMonth(){
  const cur = toDate(state.date), y = cur.getFullYear(), mo = cur.getMonth();
  const first = new Date(y, mo, 1), days = new Date(y, mo+1, 0).getDate();
  let cells = "";
  for (let i = 0; i < first.getDay(); i++) cells += `<div class="cell blank"></div>`;
  for (let d = 1; d <= days; d++){
    const key = `${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const list = (byDate[key] || []).filter(visible);
    const bars = shown().filter(l => list.some(m => m.league === l.name)).map(l => {
      const n = list.filter(m => m.league === l.name).length;
      return `<span class="bar" style="background:var(--lg-${l.slug}-soft);color:var(--lg-${l.slug})">${esc(shortName(l.name))}<b>${n}</b></span>`;
    }).join("");
    cells += `<button class="cell${key===TODAY?" today":""}" data-goto="${key}" data-back="day">
      <span class="n">${d}</span><span class="bars">${bars}</span></button>`;
  }
  return `<div class="calhead">
      <button class="navbtn" data-mon="-1" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2>${y}년 ${mo+1}월</h2>
      <button class="navbtn" data-mon="1" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="cal">${WD.map((w,i)=>`<div class="wdh${i===6?" sat":i===0?" sun":""}">${w}</div>`).join("")}${cells}</div>`;
}
// 달력 칸은 좁아서 리그 이름을 줄인다. "K리그1"->"K1", "ACL 엘리트"->"ACL"
const shortName = n => n.replace("리그","").replace(" 엘리트","").replace("코리아컵","코리아컵").slice(0,5);

/* ─────────── 팀별 뷰 ─────────── */
function viewTeam(){
  const groups = LIVE.map(l => {
    const t = new Set();
    for (const m of DATA.matches) if (m.league === l.name){ t.add(m.home); t.add(m.away); }
    return {league: l.name, teams: [...t].sort((a,b) => a.localeCompare(b,"ko"))};
  }).filter(g => g.teams.length);

  const opts = groups.map(g => `<optgroup label="${esc(g.league)}">${
    g.teams.map(t => `<option value="${esc(t)}"${state.team===t?" selected":""}>${esc(t)}</option>`).join("")}</optgroup>`).join("");
  const head = `<div class="teampick">
      <label for="teamSel" style="font-size:13px;color:var(--muted)">구단 선택</label>
      <select class="ghost" id="teamSel"><option value="">— 구단을 고르세요 —</option>${opts}</select>
    </div>`;
  if (!state.team) return head + `<div class="empty"><div class="big">구단을 고르면 시즌 전 경기가 나옵니다</div><div>리그와 컵대회를 한 줄로 이어서 봅니다.</div></div>`;

  const ms = DATA.matches.filter(m => m.home === state.team || m.away === state.team);
  const lines = ms.map(m => {
    const home = m.home === state.team, opp = home ? m.away : m.home;
    const dt = toDate(m.date), done = m.finished && m.homeGoal !== null;
    const tk = ticketLink(m);
    let rs = `<span class="rs up">예정${tk ? "<br>" + tk : ""}</span>`;
    if (done){
      const my = home ? m.homeGoal : m.awayGoal, th = home ? m.awayGoal : m.homeGoal;
      rs = `<span class="rs ${my>th?"w":my<th?"l":"d"}">${my} : ${th}</span>`;
    }
    else if (m.note) rs = `<span class="rs up">${esc(m.note)}</span>`;
    return `<div class="tline" style="${vars(m.league)}">
      <div><div class="dt">${m.date.slice(5).replace("-",".")} ${WD[dt.getDay()]}</div>
        <div class="dt" style="opacity:.7">${esc(m.time)}</div></div>
      <div><div class="op"><span class="ha">${home?"홈":"원정"}</span>${esc(opp)}<span class="lg">${esc(m.league)}</span></div>
        <div class="vn">${esc(m.venue)}</div></div>
      ${rs}</div>`;
  }).join("");

  const res = ms.filter(m => m.finished && m.homeGoal !== null);
  const w = res.filter(m => (m.home===state.team) === (m.homeGoal > m.awayGoal) && m.homeGoal !== m.awayGoal).length;
  const d = res.filter(m => m.homeGoal === m.awayGoal).length;
  const l = res.length - w - d;
  return head + `<div class="tierhead" style="${vars(ms[0].league)};margin:14px 0 0">
      <h2>${esc(state.team)}</h2><span class="n">${ms.length}경기 · ${w}승 ${d}무 ${l}패 · 잔여 ${ms.length-res.length}</span></div>${lines}`;
}

/* ─────────── 알림 탭 ─────────── */
// 직관 알리미 설정 화면. 텔레그램 봇의 [⚙️ 알림 설정] 버튼으로 열면 미니앱이 되어
// [저장] 시 조건을 봇에게 바로 넘긴다(Telegram.WebApp.sendData). 일반 브라우저에선 미리보기용.
const BOT = "jikgwan_bot";
// 지역은 build.py 가 경기마다 붙여준 m.region 을 쓴다 (regions.py 가 원본 — notify.py 와 같은 기준)
const RG = DATA.regions || { list: [], groups: {} };
const DAYS = ["월","화","수","목","금","토","일"];
const CATS = [["s","종목"],["l","리그"],["t","팀"],["g","지역"],["d","요일"]];

const AL = { rules: [], cur: 0, open: "s", tg: null };

// ?s= 로 넘어온 '지금 저장된 조건'을 읽는다 (봇이 버튼 주소에 실어 보낸다)
function b64uDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "=";
  return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
}
(function initAlert(){
  const q = new URLSearchParams(location.search);
  if (q.get("view") === "alert") state.view = "alert";
  try { const r = JSON.parse(b64uDecode(q.get("s") || "")); if (Array.isArray(r)) AL.rules = r; } catch(e){}
  AL.rules = AL.rules.filter(r => r && typeof r === "object").slice(0, 10);
  for (const r of AL.rules){
    if (r.c){ r.g = [...new Set([...(r.g||[]), ...(RG.groups["수도권"]||[])])]; delete r.c; }
    if (r.g) r.g = [...new Set(r.g.flatMap(x => RG.groups[x] || [x]))];
  }
  if (!AL.rules.length) AL.rules = [{}];

  // 텔레그램 안에서 열렸을 때만 텔레그램 스크립트를 불러온다
  if (/tgWebApp/.test(location.hash)){
    const sc = document.createElement("script");
    sc.src = "https://telegram.org/js/telegram-web-app.js";
    sc.onload = () => {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (!tg || !tg.initData) return;
      AL.tg = tg; tg.ready(); tg.expand();
      document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
      tg.MainButton.onClick(alertSave);
      state.view = "alert"; render();
    };
    document.head.appendChild(sc);
  }
})();

const normT = s => (s||"").replace(/\s+/g,"").toLowerCase();
function teamHit(t, side){
  t = normT(t); side = normT(side);
  if (t === side) return true;
  const has = (big, small) => {
    const i = big.indexOf(small); if (i < 0) return false;
    return !/[a-z0-9]/.test(big[i+small.length] || "") && !/[a-z0-9]/.test(i > 0 ? big[i-1] : "");
  };
  return has(side, t) || has(t, side);
}
function ruleHit(r, m){
  if (r.s && r.s.length && !r.s.includes(m.sport)) return false;
  if (r.l && r.l.length && !r.l.includes(m.league)) return false;
  if (r.g && r.g.length && !r.g.includes(m.region)) return false;
  if (r.d && r.d.length && !r.d.includes(DAYS[(toDate(m.date).getDay()+6) % 7])) return false;
  if (r.t && r.t.length){
    const sides = r.h ? [m.home] : [m.home, m.away];
    if (!r.t.some(t => sides.some(s => teamHit(t, s)))) return false;
  }
  return true;
}
function groupName(list){
  const left = new Set(list), parts = [];
  for (const [g, xs] of Object.entries(RG.groups)) if (xs.every(x => left.has(x))){ parts.push(g); xs.forEach(x => left.delete(x)); }
  return [...parts, ...RG.list.filter(x => left.has(x))].join("·");
}
function ruleLabel(r){
  const p = [];
  if (r.s && r.s.length) p.push(r.s.join("·"));
  if (r.l && r.l.length) p.push(r.l.join("·"));
  if (r.t && r.t.length) p.push(r.t.join("·") + (r.h ? " 홈만" : ""));
  if (r.g && r.g.length) p.push(groupName(r.g));
  if (r.d && r.d.length) p.push(r.d.join(""));
  return p.join(" · ") || "모든 경기";
}

// 고를 수 있는 항목 — 위 칸의 선택에 맞춰 좁혀진다
function optLeagues(r){ return LIVE.filter(l => !(r.s && r.s.length) || r.s.includes(l.sport)); }
function optTeams(r){
  const lgs = (r.l && r.l.length) ? r.l : optLeagues(r).map(l => l.name);
  const groups = [];
  for (const lg of lgs){
    const cnt = {}, spell = {};
    for (const m of DATA.matches) if (m.league === lg) for (const t of [m.home, m.away]){
      const k = normT(t); cnt[k] = (cnt[k]||0) + 1;
      if (!spell[k] || t.length > spell[k].length) spell[k] = t;   // 가장 긴 표기를 대표로
    }
    // 4경기 미만은 초청팀·일회성 상대라 뺀다 (예: 컵대회 해외팀)
    const teams = Object.keys(cnt).filter(k => cnt[k] >= 4).map(k => spell[k]).sort((a,b) => a.localeCompare(b,"ko"));
    if (teams.length) groups.push([lg, teams]);
  }
  return groups;
}
// 위 칸을 바꾸면 더는 고를 수 없게 된 아래 칸 선택을 정리한다
function prune(r){
  if (r.l) r.l = r.l.filter(x => optLeagues(r).some(l => l.name === x));
  if (r.t){ const ok = new Set(optTeams(r).flatMap(g => g[1]).map(normT)); r.t = r.t.filter(x => ok.has(normT(x))); }
  if (!(r.t && r.t.length)) delete r.h;
  for (const k of ["s","l","t","d","g"]) if (r[k] && !r[k].length) delete r[k];
}

function catSummary(r, k){
  if (k === "g") return (r.g && r.g.length) ? groupName(r.g).replace(/·/g, ", ") : "전국 (해외 포함)";
  if (k === "t" && r.t && r.t.length) return r.t.join(", ") + (r.h ? " (홈경기만)" : "");
  if (k === "d" && r.d && r.d.length) return r.d.join(" ");
  return (r[k] && r[k].length) ? r[k].join(", ") : "전체";
}
const pill = (k, v, on, label, dim) =>
  `<label class="aopt${on?" on":""}${dim?" dim":""}"${dim?' title="지금 남은 경기가 없어요"':""}><input type="checkbox" data-aopt="${k}" value="${esc(v)}"${on?" checked":""}>${esc(label||v)}</label>`;

function catBody(r, k){
  const has = v => !!(r[k] && r[k].includes(v));
  if (k === "s") return `<div class="aopts">${SPORTS.map(s => pill("s", s, has(s))).join("")}</div>`;
  if (k === "l") return `<div class="aopts">${optLeagues(r).map(l => pill("l", l.name, has(l.name))).join("")}</div>`;
  if (k === "t"){
    const g = optTeams(r);
    return g.map(([lg, ts]) => `<div class="agrp">${esc(lg)}</div><div class="aopts">${ts.map(t => pill("t", t, has(t))).join("")}</div>`).join("")
      + (r.t && r.t.length ? `<div class="aopts" style="margin-top:12px">${pill("h", "1", !!r.h, "고른 팀의 홈경기만")}</div>` : "");
  }
  if (k === "g"){
    const live = new Set(DATA.matches.filter(m => !m.finished && m.date >= TODAY).map(m => m.region));
    return `<div class="agrp">권역으로 한 번에</div>
      <div class="aquick" style="margin-top:0">${Object.entries(RG.groups).map(([g, xs]) =>
        `<button data-agroup="${esc(g)}" title="${esc(xs.join("·"))}">${esc(g)}</button>`).join("")}</div>
      <div class="agrp">시·도</div>
      <div class="aopts">${RG.list.map(x => pill("g", x, has(x), x, !live.has(x))).join("")}</div>
      <p style="color:var(--muted);font-size:12px;margin:10px 0 0">흐린 지역은 지금 남은 경기가 없는 곳이에요 (골라두면 일정이 나올 때 알려드려요).
        광주·전남은 2026년 통합특별시가 됐지만 경기장 사이가 멀어 따로 고를 수 있게 뒀어요.</p>`;
  }
  if (k === "d") return `<div class="aopts">${DAYS.map(d => pill("d", d, has(d))).join("")}</div>
    <div class="aquick"><button data-aquick="we">주말만</button><button data-aquick="wd">평일만</button><button data-aquick="all">요일 무관</button></div>`;
  return "";
}

function viewAlert(){
  const r = AL.rules[AL.cur];
  const upcoming = DATA.matches.filter(m => !m.finished && m.date >= TODAY);
  const hit = upcoming.filter(m => ruleHit(r, m));
  const anyHit = upcoming.filter(m => AL.rules.some(x => ruleHit(x, m)));
  const inTg = !!AL.tg;
  if (inTg){
    AL.tg.MainButton.setText(`저장하기 · 조건 ${AL.rules.length}개`);
    AL.tg.MainButton.show();
  }

  return `<div class="alertbox">
    <h2 class="at">🔔 직관 알리미</h2>
    <p class="lead">칸을 눌러 펼치고 체크하세요. <b>같은 칸 안은 "또는"</b>, <b>칸끼리는 "그리고"</b>예요.
      조합이 여러 개면 [+ 조건 추가]로 카드를 하나 더 만드세요. 카드끼리는 "또는"이에요.</p>

    <div class="arules">
      ${AL.rules.map((x, i) => `<div class="arule${i===AL.cur?" on":""}" data-arule="${i}">
        <b>조건 ${i+1}</b><span>${esc(ruleLabel(x))}</span>
        ${AL.rules.length > 1 ? `<button class="x" data-adel="${i}" aria-label="조건 ${i+1} 지우기">×</button>` : ""}</div>`).join("")}
      ${AL.rules.length < 10 ? `<button class="aadd" id="aAdd">+ 조건 추가</button>` : ""}
    </div>

    ${CATS.map(([k, name]) => {
      const set = !!(r[k] && r[k].length);
      const open = AL.open === k;
      return `<div class="acat${open?" open":""}">
        <button class="acat-h" data-acat="${k}" aria-expanded="${open}">
          <span class="k">${name}</span><span class="v${set?" set":""}">${esc(catSummary(r, k))}</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        ${open ? `<div class="acat-b">${catBody(r, k)}${set ? `<button class="aclear" data-aclear="${k}">이 칸 선택 지우기</button>` : ""}</div>` : ""}
      </div>`;
    }).join("")}

    <div class="asave">${inTg
      ? `조건 ${AL.rules.length}개 · 앞으로 맞는 경기 <b>${anyHit.length}</b>개<br>
         아래 <b>[저장하기]</b>를 누르면 봇에게 바로 전달돼요. 등록 확인 답장은 다음 확인 시각(06:00 · 09:00 · 23:30)에 와요.
         <div class="row"><button class="abtn solid" id="aSave">저장하기</button></div>`
      : `여기서는 <b>미리보기</b>만 돼요. 저장은 텔레그램 봇의 <b>[⚙️ 알림 설정]</b> 버튼으로 이 화면을 열어서 해주세요.
         (텔레그램이 보안상 그 버튼으로 연 화면에서만 저장을 허락해요.)
         <div class="row"><a class="abtn solid" href="https://t.me/${BOT}?start=setup" target="_blank" rel="noopener">텔레그램 @${BOT} 열기</a></div>`}
    </div>

    <div class="tierhead" style="--tier:var(--ink);--tier-soft:var(--surface-2)">
      <h2 style="font-size:16px">조건 ${AL.cur+1}에 맞는 다가오는 경기</h2><span class="n">${hit.length}경기</span></div>
    ${hit.slice(0, 10).map(m => `<div class="tline" style="${vars(m.league)}">
      <div><div class="dt">${m.date.slice(5).replace("-",".")} ${WD[toDate(m.date).getDay()]}</div>
        <div class="dt" style="opacity:.7">${esc(m.time)}</div></div>
      <div><div class="op">${esc(m.home)} vs ${esc(m.away)}<span class="lg">${esc(m.league)}</span></div>
        <div class="vn">${esc(m.venue)} · ${esc(m.region)}</div></div></div>`).join("")}
    ${hit.length > 10 ? `<p style="color:var(--muted);font-size:13px">…외 ${hit.length-10}경기</p>` : ""}
    ${!hit.length ? `<p style="color:var(--muted);font-size:13.5px">지금 데이터에는 맞는 경기가 없어요. 일정이 나오면 그때 알려드려요.</p>` : ""}
  </div>`;
}

function alertSave(){
  if (!AL.tg) return;
  const rules = AL.rules.map(r => { const c = {...r}; prune(c); return c; }).filter(r => Object.keys(r).length);
  const payload = JSON.stringify({ v: 1, r: rules.length ? rules : [] });
  if (new TextEncoder().encode(payload).length > 4000){
    AL.tg.showAlert("조건이 너무 많아요. 팀이나 카드를 조금 줄여주세요."); return;
  }
  AL.tg.sendData(payload);          // 보내고 나면 텔레그램이 창을 닫는다
}

function alertClick(e){
  const r = AL.rules[AL.cur];
  const t = e.target.closest("[data-acat],[data-arule],[data-adel],[data-aquick],[data-agroup],[data-aclear],#aAdd,#aSave");
  if (!t) return false;
  if (t.dataset.adel !== undefined){ e.stopPropagation();
    AL.rules.splice(+t.dataset.adel, 1); AL.cur = Math.min(AL.cur, AL.rules.length-1); render(); return true; }
  if (t.dataset.acat){ AL.open = AL.open === t.dataset.acat ? null : t.dataset.acat; render(); return true; }
  if (t.dataset.arule !== undefined){ AL.cur = +t.dataset.arule; render(); return true; }
  if (t.dataset.aquick){ const q = t.dataset.aquick;
    if (q === "all") delete r.d; else r.d = q === "we" ? ["토","일"] : ["월","화","수","목","금"];
    render(); return true; }
  if (t.dataset.agroup){
    const xs = RG.groups[t.dataset.agroup] || [], cur = new Set(r.g || []);
    const allOn = xs.every(x => cur.has(x));
    xs.forEach(x => allOn ? cur.delete(x) : cur.add(x));
    r.g = RG.list.filter(x => cur.has(x)); prune(r); render(); return true;
  }
  if (t.dataset.aclear){ const k = t.dataset.aclear; delete r[k]; if (k === "t") delete r.h; prune(r); render(); return true; }
  if (t.id === "aAdd"){ AL.rules.push({}); AL.cur = AL.rules.length-1; AL.open = "s"; render(); return true; }
  if (t.id === "aSave"){ alertSave(); return true; }
  return false;
}
function alertChange(e){
  const k = e.target.dataset.aopt; if (!k) return false;
  const r = AL.rules[AL.cur], v = e.target.value, on = e.target.checked;
  if (k === "h") r.h = on ? 1 : 0;
  else { r[k] = r[k] || []; if (on){ if (!r[k].includes(v)) r[k].push(v); } else r[k] = r[k].filter(x => x !== v); }
  if (!r.h) delete r.h;
  prune(r); render(); return true;
}

/* ─────────── 렌더 ─────────── */
function render(){
  renderSports(); renderStrip(); renderChips();
  $(".datebar").style.display = (state.view === "team" || state.view === "alert") ? "none" : "";
  $("#sports").style.display = (MULTISPORT && state.view !== "team" && state.view !== "alert") ? "" : "none";
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === state.view));
  $("#main").innerHTML = state.view === "day" ? viewDay() : state.view === "month" ? viewMonth() : state.view === "alert" ? viewAlert() : viewTeam();
}

/* ─────────── 이벤트 ─────────── */
document.addEventListener("click", e => {
  const sport = e.target.closest("[data-sport]");
  if (sport){ state.sport = sport.dataset.sport || null; state.off.clear(); return render(); }

  const chip = e.target.closest(".chip");
  if (chip){
    const lg = chip.dataset.lg;
    state.off.has(lg) ? state.off.delete(lg) : state.off.add(lg);
    if (state.off.size === shown().length) state.off.clear();   // 전부 끄면 전부 켠다
    return render();
  }
  const tab = e.target.closest(".tab");
  if (tab){ state.view = tab.dataset.view; return render(); }
  if (state.view === "alert" && alertClick(e)) return;

  const day = e.target.closest(".day");
  if (day){ state.date = day.dataset.d; return render(); }

  const goto = e.target.closest("[data-goto]");
  if (goto){
    state.date = goto.dataset.goto;
    if (goto.dataset.back) state.view = "day";
    window.scrollTo({top:0, behavior:"smooth"});
    return render();
  }
  const mon = e.target.closest("[data-mon]");
  if (mon){
    const c = toDate(state.date);
    c.setDate(1); c.setMonth(c.getMonth() + Number(mon.dataset.mon));
    state.date = iso(c);
    return render();
  }
  if (e.target.closest("#prevDay")){ state.date = shift(state.date,-1); return render(); }
  if (e.target.closest("#nextDay")){ state.date = shift(state.date, 1); return render(); }
  if (e.target.closest("#todayBtn")){ state.date = TODAY; state.view = "day"; return render(); }
});

document.addEventListener("change", e => {
  if (e.target.id === "datePick" && e.target.value){ state.date = e.target.value; render(); }
  if (e.target.id === "teamSel"){ state.team = e.target.value || null; render(); }
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input,select,textarea")) return;
  if (e.key === "ArrowLeft"){ state.date = shift(state.date,-1); render(); }
  if (e.key === "ArrowRight"){ state.date = shift(state.date, 1); render(); }
});

renderHeader();
document.addEventListener("change", e => { if (state.view === "alert") alertChange(e); });

render();
</script>
